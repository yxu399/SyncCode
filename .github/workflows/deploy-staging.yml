name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '18'
  DEPLOYMENT_ENV: staging

jobs:
  # Run tests unless explicitly skipped
  pre-deployment-tests:
    name: Pre-deployment Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Type check
        run: |
          cd packages/server && npx tsc --noEmit
          cd ../client && npx tsc --noEmit

  # Database migration
  database-migration:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [pre-deployment-tests]
    if: always() && (needs.pre-deployment-tests.result == 'success' || needs.pre-deployment-tests.result == 'skipped')
    environment:
      name: staging
      url: https://staging-api.synccode.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: packages/server
        run: npx prisma generate

      - name: Run migrations
        working-directory: packages/server
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          echo "Running database migrations..."
          npx prisma migrate deploy

          echo "Verifying schema..."
          npx prisma validate

      - name: Backup database
        if: failure()
        run: |
          echo "Migration failed - database backup should be restored"
          # Add database backup restoration logic here

  # Deploy to staging
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [database-migration]
    environment:
      name: staging
      url: https://staging.synccode.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker images
        run: |
          docker pull ghcr.io/${{ github.repository }}-server:develop
          docker pull ghcr.io/${{ github.repository }}-client:develop

      - name: Tag images for ECR
        run: |
          docker tag ghcr.io/${{ github.repository }}-server:develop ${{ steps.login-ecr.outputs.registry }}/synccode-server:staging
          docker tag ghcr.io/${{ github.repository }}-client:develop ${{ steps.login-ecr.outputs.registry }}/synccode-client:staging

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/synccode-server:staging
          docker push ${{ steps.login-ecr.outputs.registry }}/synccode-client:staging

      - name: Update ECS service (Server)
        run: |
          # Update task definition
          aws ecs register-task-definition \
            --cli-input-json file://.aws/task-definitions/server-staging.json \
            --family synccode-server-staging

          # Update service
          aws ecs update-service \
            --cluster synccode-staging \
            --service synccode-server \
            --task-definition synccode-server-staging \
            --force-new-deployment

      - name: Update ECS service (Client)
        run: |
          # Update task definition
          aws ecs register-task-definition \
            --cli-input-json file://.aws/task-definitions/client-staging.json \
            --family synccode-client-staging

          # Update service
          aws ecs update-service \
            --cluster synccode-staging \
            --service synccode-client \
            --task-definition synccode-client-staging \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster synccode-staging \
            --services synccode-server synccode-client

  # Post-deployment verification
  post-deployment-tests:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health check - Server
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" https://staging-api.synccode.example.com/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "Server health check passed"

      - name: Health check - Client
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" https://staging.synccode.example.com/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "Client health check passed"

      - name: Smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
          # Example: curl tests for critical endpoints

          # Test authentication endpoint
          curl -f -X POST https://staging-api.synccode.example.com/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","username":"testuser","password":"TestPass123!"}' || true

          echo "Smoke tests completed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment verification failed - initiating rollback"
          # Add rollback logic here

  # Notify team
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, post-deployment-tests]
    if: always()
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] && \
             [ "${{ needs.post-deployment-tests.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=Deployment to staging completed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=Deployment to staging failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST ${{ vars.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.message }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment*\n*Status:* ${{ steps.status.outputs.status }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*URL:* https://staging.synccode.example.com"
                  }
                }
              ]
            }'

      - name: Create deployment record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              auto_merge: false,
              required_contexts: []
            });
