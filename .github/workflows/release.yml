name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          semantic_version: 23.0.0
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.3
            conventional-changelog-conventionalcommits@7.0.2

      - name: Output release info
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "New release published: v${{ steps.semantic.outputs.new_release_version }}"
          echo "Release notes:"
          echo "${{ steps.semantic.outputs.new_release_notes }}"

  # Trigger Docker build for the new release
  trigger-docker-build:
    name: Trigger Docker Build
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Docker workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'v${{ needs.release.outputs.new_release_version }}'
            });

  # Create GitHub Release
  create-github-release:
    name: Create GitHub Release
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Generate release notes
        id: notes
        run: |
          # Extract changelog for this version
          version="${{ needs.release.outputs.new_release_version }}"
          changelog=$(awk "/^## \[$version\]/,/^## \[/ {print}" CHANGELOG.md | head -n -1)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v${{ needs.release.outputs.new_release_version }}',
              name: 'v${{ needs.release.outputs.new_release_version }}',
              body: `${{ steps.notes.outputs.notes }}`,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            });

  # Notify stakeholders
  notify:
    name: Notify Release
    needs: [release, create-github-release]
    if: always() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST ${{ vars.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🎉 New release published: v${{ needs.release.outputs.new_release_version }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*New Release Published* 🎉\n*Version:* `v${{ needs.release.outputs.new_release_version }}`\n*Repository:* ${{ github.repository }}\n*Released by:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Release"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.release.outputs.new_release_version }}"
                    }
                  ]
                }
              ]
            }'

      - name: Create announcement issue
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            const releaseUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version}`;

            const body = [
              'A new version of SyncCode has been released!',
              '',
              `## Version: v${version}`,
              '',
              `Check out the [release notes](${releaseUrl}) for details.`,
              '',
              '### What\'s Next?',
              '- The Docker images are being built and will be available soon',
              '- Production deployment can be triggered manually via the Actions tab',
              '',
              'cc: @team'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📢 Release v${version}`,
              body: body,
              labels: ['release', 'announcement']
            });
