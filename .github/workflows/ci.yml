name: CI Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '16'
  REDIS_VERSION: '7'

jobs:
  # Code quality and linting
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type checking (shared)
        run: yarn workspace @collab/shared run build

      - name: Type checking (server)
        working-directory: packages/server
        run: npx tsc --noEmit

      - name: Type checking (client)
        working-directory: packages/client
        run: npx tsc --noEmit

      - name: Security audit
        run: |
          yarn audit --level moderate || true
          echo "Security audit completed"

  # Build all packages
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        package: [shared, server, client]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package first (if needed)
        if: matrix.package != 'shared'
        run: yarn workspace @collab/shared run build

      - name: Build ${{ matrix.package }}
        run: yarn workspace @collab/${{ matrix.package }} run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist
          retention-days: 7

  # Database tests with Prisma
  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn workspace @collab/shared run build

      - name: Generate Prisma Client
        working-directory: packages/server
        run: npx prisma generate

      - name: Run database migrations
        working-directory: packages/server
        run: npx prisma migrate deploy

      - name: Verify database schema
        working-directory: packages/server
        run: npx prisma validate

      - name: Test database connection
        working-directory: packages/server
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.\$connect()
            .then(() => { console.log('Database connected'); process.exit(0); })
            .catch(e => { console.error('Database error:', e); process.exit(1); });
          "

  # Integration tests (when tests are added)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, database-tests]
    if: false  # Enable when tests are implemented
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_key_for_ci
      JWT_REFRESH_SECRET: test_refresh_secret_key_for_ci
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: packages

      - name: Run tests
        run: yarn test

  # Build status check
  build-success:
    name: Build Success
    runs-on: ubuntu-latest
    needs: [quality, build, database-tests]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.database-tests.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
          echo "All checks passed"

      - name: Post status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI pipeline completed successfully!'
            })
