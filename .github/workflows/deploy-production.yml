name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '18'
  DEPLOYMENT_ENV: production

jobs:
  # Approval gate
  approval:
    name: Deployment Approval
    runs-on: ubuntu-latest
    environment:
      name: production-approval
    steps:
      - name: Approval required
        run: echo "Production deployment approved"

  # Pre-deployment backup
  backup:
    name: Backup Production Database
    runs-on: ubuntu-latest
    needs: [approval]
    environment:
      name: production
      url: https://api.synccode.example.com
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Create RDS snapshot
        id: snapshot
        run: |
          timestamp=$(date +%Y%m%d-%H%M%S)
          snapshot_id="synccode-prod-pre-deploy-${timestamp}"

          aws rds create-db-snapshot \
            --db-instance-identifier synccode-production \
            --db-snapshot-identifier $snapshot_id

          echo "snapshot_id=$snapshot_id" >> $GITHUB_OUTPUT

      - name: Wait for snapshot completion
        run: |
          aws rds wait db-snapshot-completed \
            --db-snapshot-identifier ${{ steps.snapshot.outputs.snapshot_id }}

      - name: Tag snapshot
        run: |
          aws rds add-tags-to-resource \
            --resource-name arn:aws:rds:${{ vars.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:snapshot:${{ steps.snapshot.outputs.snapshot_id }} \
            --tags Key=Environment,Value=production \
                   Key=Purpose,Value=pre-deployment-backup \
                   Key=DeploymentSha,Value=${{ github.sha }}

  # Database migration with rollback capability
  database-migration:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [backup]
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: packages/server
        run: npx prisma generate

      - name: Dry run migrations
        working-directory: packages/server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "Checking pending migrations..."
          npx prisma migrate status

      - name: Run migrations
        working-directory: packages/server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "Running database migrations..."
          npx prisma migrate deploy

          echo "Verifying schema..."
          npx prisma validate

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Migration failed - initiating database restore"
          # Restore from snapshot logic would go here

  # Blue-green deployment strategy
  deploy:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: [database-migration]
    environment:
      name: production
      url: https://synccode.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and tag images
        run: |
          # Pull from GitHub Container Registry
          docker pull ghcr.io/${{ github.repository }}-server:${{ steps.version.outputs.version }}
          docker pull ghcr.io/${{ github.repository }}-client:${{ steps.version.outputs.version }}

          # Tag for ECR
          docker tag ghcr.io/${{ github.repository }}-server:${{ steps.version.outputs.version }} \
            ${{ steps.login-ecr.outputs.registry }}/synccode-server:production
          docker tag ghcr.io/${{ github.repository }}-client:${{ steps.version.outputs.version }} \
            ${{ steps.login-ecr.outputs.registry }}/synccode-client:production

          # Push to ECR
          docker push ${{ steps.login-ecr.outputs.registry }}/synccode-server:production
          docker push ${{ steps.login-ecr.outputs.registry }}/synccode-client:production

      - name: Deploy green environment (Server)
        id: deploy-server
        run: |
          # Create new task definition for green environment
          aws ecs register-task-definition \
            --cli-input-json file://.aws/task-definitions/server-production.json \
            --family synccode-server-production

          # Get current task definition ARN
          current_task_def=$(aws ecs describe-services \
            --cluster synccode-production \
            --services synccode-server \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "current_task_def=$current_task_def" >> $GITHUB_OUTPUT

          # Update service with new task definition
          aws ecs update-service \
            --cluster synccode-production \
            --service synccode-server \
            --task-definition synccode-server-production \
            --force-new-deployment

      - name: Deploy green environment (Client)
        id: deploy-client
        run: |
          # Create new task definition for green environment
          aws ecs register-task-definition \
            --cli-input-json file://.aws/task-definitions/client-production.json \
            --family synccode-client-production

          # Get current task definition ARN
          current_task_def=$(aws ecs describe-services \
            --cluster synccode-production \
            --services synccode-client \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "current_task_def=$current_task_def" >> $GITHUB_OUTPUT

          # Update service with new task definition
          aws ecs update-service \
            --cluster synccode-production \
            --service synccode-client \
            --task-definition synccode-client-production \
            --force-new-deployment

      - name: Wait for green deployment
        run: |
          echo "Waiting for new tasks to become healthy..."
          aws ecs wait services-stable \
            --cluster synccode-production \
            --services synccode-server synccode-client

      - name: Monitor deployment
        run: |
          echo "Monitoring deployment health for 5 minutes..."
          sleep 300

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed - rolling back to previous version"

          # Rollback server
          aws ecs update-service \
            --cluster synccode-production \
            --service synccode-server \
            --task-definition ${{ steps.deploy-server.outputs.current_task_def }}

          # Rollback client
          aws ecs update-service \
            --cluster synccode-production \
            --service synccode-client \
            --task-definition ${{ steps.deploy-client.outputs.current_task_def }}

  # Production verification
  production-verification:
    name: Production Verification
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for services
        run: sleep 60

      - name: Health checks
        run: |
          # Server health check
          response=$(curl -f -s -o /dev/null -w "%{http_code}" https://api.synccode.example.com/health)
          if [ "$response" != "200" ]; then
            echo "Server health check failed: $response"
            exit 1
          fi

          # Client health check
          response=$(curl -f -s -o /dev/null -w "%{http_code}" https://synccode.example.com/health)
          if [ "$response" != "200" ]; then
            echo "Client health check failed: $response"
            exit 1
          fi

          echo "All health checks passed"

      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test critical user flows
          # 1. User registration/login
          # 2. Document creation
          # 3. Real-time collaboration
          # 4. Metrics endpoint

          # Test metrics endpoint
          curl -f https://api.synccode.example.com/metrics > /dev/null

          echo "Smoke tests passed"

      - name: Performance baseline check
        run: |
          echo "Checking performance metrics..."

          # Compare current metrics with baseline
          # Alert if response times are significantly degraded

      - name: Initiate rollback on failure
        if: failure()
        run: |
          echo "Production verification failed - manual rollback required"
          exit 1

  # Cleanup old resources
  cleanup:
    name: Cleanup Old Resources
    runs-on: ubuntu-latest
    needs: [production-verification]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deregister old task definitions
        run: |
          echo "Keeping last 5 task definition revisions"
          # Keep last 5 revisions for rollback capability

      - name: Clean up old Docker images
        run: |
          echo "Cleaning up old ECR images..."
          # Keep last 10 images, delete older ones

  # Notify stakeholders
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy, production-verification, cleanup]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] && \
             [ "${{ needs.production-verification.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send notifications
        run: |
          # Slack notification
          if [ -n "${{ vars.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ vars.SLACK_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d '{
                "text": "${{ steps.status.outputs.emoji }} Production Deployment ${{ steps.status.outputs.status }}",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment*\n*Status:* ${{ steps.status.outputs.status }}\n*Version:* `${{ github.ref_name }}`\n*Deployed by:* ${{ github.actor }}\n*URL:* https://synccode.example.com"
                  }
                }]
              }'
          fi

      - name: Create GitHub release
        if: steps.status.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true,
              draft: false,
              prerelease: false
            });
